<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>

    <link rel="stylesheet" href="calculator.css">
</head>

<body>

    <div class="calculator">
        
        <input type="text" id="display1">
        <input type="text" id="display2">


        <div class="buttons">

            <button id="clear" class="clear" onclick="">C</button>
            <!-- <button onclick="deleteLast()">DEL</button> -->
            <button id="devision" class="operator" onclick="('/')">÷</button>
            <button id="multiplication" class="operator" onclick="('*')">×</button>

            <!-- <button onclick="addValue('7')">7</button>
            <button onclick="addValue('8')">8</button>
            <button onclick="addValue('9')">9</button> -->
            <button id="sub" class="operator" onclick="('-')">-</button>

            <!-- <button onclick="addValue('4')">4</button>
            <button onclick="addValue('5')">5</button>
            <button onclick="addValue('6')">6</button> -->
            <button id="plus" class="operator" onclick="('+')">+</button>

            <!-- <button onclick="addValue('1')">1</button>
            <button onclick="addValue('2')">2</button>
            <button onclick="addValue('3')">3</button> -->
            <!-- <button onclick="addValue('.')">.</button> -->

            <!-- <button onclick="addValue('0')">0</button> -->
            <!-- <button id="equalbtn" class="equal" onclick="calculate()">=</button> -->

        </div>
    </div>

























    <script src="calculator.js"></script>

</body>

</html>
